<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator KML</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:20px;
    background:#f5f5f5;
}

.container{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.box{
    background:white;
    padding:15px;
    border-radius:8px;
    box-shadow:0 0 5px rgba(0,0,0,.1);
}

textarea{
    width:100%;
    height:250px;
    resize:vertical;
}

button{
    padding:10px 20px;
    margin:5px;
    cursor:pointer;
}

.layer-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin:5px 0;
}

.layer-name{
    min-width:200px;
}

select{
    padding:4px;
}

</style>
</head>
<body>

<h2>Generator KML</h2>

<div class="container">

<div class="box">
    <h3>Coordonate (Latitudine Longitudine)</h3>
    <textarea id="coords"></textarea>
</div>

<div class="box">
    <h3>Denumire puncte</h3>
    <textarea id="names"></textarea>
</div>

<div class="box">
    <h3>Operațiuni (Layere)</h3>
    <textarea id="layers"></textarea>
</div>

<div class="box">

    <h3>Layere</h3>

    <button onclick="detectLayers()">
        Detectează layere
    </button>

    <button onclick="selectAllLayers(true)">
        Selectează toate
    </button>

    <button onclick="selectAllLayers(false)">
        Debifează toate
    </button>

    <hr>

    <div id="layerColors"></div>

</div>

</div>

<hr>

<button onclick="exportKML()">
    Export KML
</button>

<script>

const iconMap = {

    red:
    "http://maps.google.com/mapfiles/kml/paddle/red-circle.png",

    blue:
    "http://maps.google.com/mapfiles/kml/paddle/blu-circle.png",

    green:
    "http://maps.google.com/mapfiles/kml/paddle/grn-circle.png",

    yellow:
    "http://maps.google.com/mapfiles/kml/paddle/ylw-circle.png",

    purple:
    "http://maps.google.com/mapfiles/kml/paddle/purple-circle.png",

    orange:
    "http://maps.google.com/mapfiles/kml/paddle/orange-circle.png"

};

function detectLayers(){

    const layerLines =
        document.getElementById("layers")
        .value
        .split(/\r?\n/);

    const counts = {};

    layerLines.forEach(layer=>{

        layer = layer.trim();

        if(layer === "")
            layer = "Neclasificat";

        counts[layer] =
            (counts[layer] || 0) + 1;

    });

    const container =
        document.getElementById(
            "layerColors"
        );

    container.innerHTML = "";

    Object.keys(counts).forEach(layer=>{

        const row =
            document.createElement("div");

        row.className =
            "layer-row";

        row.innerHTML = `
            <input
                type="checkbox"
                class="layer-enabled"
                data-layer="${layer}"
                checked>

            <span class="layer-name">
                ${layer} (${counts[layer]})
            </span>

            <select
                class="layer-color"
                data-layer="${layer}">

                <option value="red">
                    🔴 Roșu
                </option>

                <option value="blue">
                    🔵 Albastru
                </option>

                <option value="green">
                    🟢 Verde
                </option>

                <option value="yellow">
                    🟡 Galben
                </option>

                <option value="purple">
                    🟣 Mov
                </option>

                <option value="orange">
                    🟠 Portocaliu
                </option>

            </select>
        `;

        container.appendChild(row);

    });

}

function selectAllLayers(value){

    document
    .querySelectorAll(
        ".layer-enabled"
    )
    .forEach(cb=>{
        cb.checked = value;
    });

}

function buildKML(){

    const coordLines =
        document
        .getElementById("coords")
        .value
        .trim()
        .split(/\r?\n/);

    const nameLines =
        document
        .getElementById("names")
        .value
        .split(/\r?\n/);

    const layerLines =
        document
        .getElementById("layers")
        .value
        .split(/\r?\n/);

    const layerColors = {};
    const enabledLayers = {};

    document
    .querySelectorAll(
        ".layer-color"
    )
    .forEach(el=>{

        layerColors[
            el.dataset.layer
        ] = el.value;

    });

    document
    .querySelectorAll(
        ".layer-enabled"
    )
    .forEach(el=>{

        enabledLayers[
            el.dataset.layer
        ] = el.checked;

    });

    const folders = {};

    for(let i=0;
        i<coordLines.length;
        i++){

        const coord =
            coordLines[i]
            .trim()
            .split(/\s+/);

        if(coord.length < 2)
            continue;

        const lat = coord[0];
        const lon = coord[1];

        let name =
            (nameLines[i] || "")
            .trim();

        if(name === "")
            name = "Stalp";

        let layer =
            (layerLines[i] || "")
            .trim();

        if(layer === "")
            layer = "Neclasificat";

        if(!folders[layer])
            folders[layer] = [];

        folders[layer].push({
            name,
            lat,
            lon
        });

    }

    let kml =
`<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>`;

    Object.keys(folders)
    .forEach(layer=>{

        if(!enabledLayers[layer])
            return;

        const iconUrl =
            iconMap[
                layerColors[layer]
            ] || iconMap.red;

        kml += `
<Style id="${layer}">
<IconStyle>
<scale>1.2</scale>
<Icon>
<href>${iconUrl}</href>
</Icon>
</IconStyle>
</Style>

<Folder>
<name>${layer}</name>`;

        folders[layer]
        .forEach(point=>{

            kml += `
<Placemark>
<name>${point.name}</name>
<styleUrl>#${layer}</styleUrl>
<Point>
<coordinates>
${point.lon},${point.lat},0
</coordinates>
</Point>
</Placemark>`;

        });

        kml += `
</Folder>`;

    });

    kml += `
</Document>
</kml>`;

    return kml;

}

function exportKML(){

    const blob =
        new Blob(
            [buildKML()],
            {
                type:
                "application/vnd.google-earth.kml+xml"
            }
        );

    const a =
        document.createElement("a");

    a.href =
        URL.createObjectURL(blob);

    a.download =
        "puncte.kml";

    a.click();

}

</script>

</body>
</html>
