<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator KML</title>

<style>

body{
    font-family:'Segoe UI',Arial,sans-serif;
    margin:0;
    background:#f4f7fb;
    color:#333;
}
.header{
    background:linear-gradient(
        135deg,
        #005baa,
        #0072ce
    );
    color:white;
    padding:20px 30px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.logo-area{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo-icon{
    width:55px;
    height:55px;
    border-radius:12px;
    background:white;
    color:#005baa;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.app-title{
    font-size:24px;
    font-weight:700;
}

.app-subtitle{
    opacity:.9;
    font-size:14px;
}

.container{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:20px;
    padding:20px;
}

.layers-box{
    grid-column:1 / 4;
}

.box{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:
        0 8px 24px
        rgba(0,0,0,.08);
}

textarea{
    width:100%;
    height:180px;
    resize:vertical;
    box-sizing:border-box;
}

button{
    background:#005baa;
    color:white;
    border:none;
    border-radius:10px;
    padding:10px 18px;
    cursor:pointer;
    font-weight:600;
    transition:.2s;
}

button:hover{
    background:#00468a;
}

.layer-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin:5px 0;
}

.layer-name{
    min-width:200px;
}

select{
    padding:4px;
}

</style>
</head>
<body>

<div class="header">

    <div class="logo-area">

        <div class="logo-icon">
            PC
        </div>

        <div>

            <div class="app-title">
                PRO CONECT GIS TOOLS
            </div>

            <div class="app-subtitle">
                Generator KML
            </div>

        </div>

    </div>

</div>



<div class="container">

    <div class="box">
        <h3>📍 Coordonate</h3>
        <textarea id="coords"></textarea>
    </div>

    <div class="box">
        <h3>📋 Denumire puncte</h3>
        <textarea id="names"></textarea>
    </div>

    <div class="box">
        <h3>🔧 Operațiuni (Layere)</h3>
        <textarea id="layers"></textarea>
    </div>

    <div class="box layers-box">

        <h3>🎨 Layere detectate</h3>

        <button onclick="detectLayers()">
            Detectează layere
        </button>

        <button onclick="selectAllLayers(true)">
            Selectează toate
        </button>

        <button onclick="selectAllLayers(false)">
            Debifează toate
        </button>

        <hr>

        <div id="layerColors"></div>

    </div>

</div>

<hr>

<div style="text-align:center;">
    <button onclick="exportKML()">
    Export KML
</button>

<button onclick="openGoogleMaps()">
    📍 Rută Google Maps
</button>
<label style="margin-left:15px;">

    <input
        type="checkbox"
        id="optimizeRoute"
        checked>

    Optimizează traseul

</label>
</div>
   
</button>

<script>

const iconMap = {

    red:
    "http://maps.google.com/mapfiles/kml/paddle/red-circle.png",

    blue:
    "http://maps.google.com/mapfiles/kml/paddle/blu-circle.png",

    green:
    "http://maps.google.com/mapfiles/kml/paddle/grn-circle.png",

    yellow:
    "http://maps.google.com/mapfiles/kml/paddle/ylw-circle.png",

    purple:
    "http://maps.google.com/mapfiles/kml/paddle/purple-circle.png",

    orange:
    "http://maps.google.com/mapfiles/kml/paddle/orange-circle.png"

};

function detectLayers(){

    const layerLines =
        document.getElementById("layers")
        .value
        .split(/\r?\n/);

    const counts = {};

    layerLines.forEach(layer=>{

        layer = layer.trim();

        if(layer === "")
            layer = "Neclasificat";

        counts[layer] =
            (counts[layer] || 0) + 1;

    });

    const container =
        document.getElementById(
            "layerColors"
        );

    container.innerHTML = "";

    Object.keys(counts).forEach(layer=>{

        const row =
            document.createElement("div");

        row.className =
            "layer-row";

        row.innerHTML = `
            <input
                type="checkbox"
                class="layer-enabled"
                data-layer="${layer}"
                checked>

            <span class="layer-name">
                ${layer} (${counts[layer]})
            </span>

            <select
                class="layer-color"
                data-layer="${layer}">

                <option value="red">
                    🔴 Roșu
                </option>

                <option value="blue">
                    🔵 Albastru
                </option>

                <option value="green">
                    🟢 Verde
                </option>

                <option value="yellow">
                    🟡 Galben
                </option>

                <option value="purple">
                    🟣 Mov
                </option>

                <option value="orange">
                    🟠 Portocaliu
                </option>

            </select>
        `;

        container.appendChild(row);

    });

}

function selectAllLayers(value){

    document
    .querySelectorAll(
        ".layer-enabled"
    )
    .forEach(cb=>{
        cb.checked = value;
    });

}

function buildKML(){

    const coordLines =
        document
        .getElementById("coords")
        .value
        .trim()
        .split(/\r?\n/);

    const nameLines =
        document
        .getElementById("names")
        .value
        .split(/\r?\n/);

    const layerLines =
        document
        .getElementById("layers")
        .value
        .split(/\r?\n/);

    const layerColors = {};
    const enabledLayers = {};

    document
    .querySelectorAll(
        ".layer-color"
    )
    .forEach(el=>{

        layerColors[
            el.dataset.layer
        ] = el.value;

    });

    document
    .querySelectorAll(
        ".layer-enabled"
    )
    .forEach(el=>{

        enabledLayers[
            el.dataset.layer
        ] = el.checked;

    });

    const folders = {};

    for(let i=0;
        i<coordLines.length;
        i++){

        const coord =
            coordLines[i]
            .trim()
            .split(/\s+/);

        if(coord.length < 2)
            continue;

        const lat = coord[0];
        const lon = coord[1];

        let name =
            (nameLines[i] || "")
            .trim();

        if(name === "")
            name = "Stalp";

        let layer =
            (layerLines[i] || "")
            .trim();

        if(layer === "")
            layer = "Neclasificat";

        if(!folders[layer])
            folders[layer] = [];

        folders[layer].push({
            name,
            lat,
            lon
        });

    }

    let kml =
`<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>`;

    Object.keys(folders)
    .forEach(layer=>{

        if(!enabledLayers[layer])
            return;

        const iconUrl =
            iconMap[
                layerColors[layer]
            ] || iconMap.red;

        kml += `
<Style id="${layer}">
<IconStyle>
<scale>1.2</scale>
<Icon>
<href>${iconUrl}</href>
</Icon>
</IconStyle>
</Style>

<Folder>
<name>${layer}</name>`;

        folders[layer]
        .forEach(point=>{

            kml += `
<Placemark>
<name>${point.name}</name>
<styleUrl>#${layer}</styleUrl>
<Point>
<coordinates>
${point.lon},${point.lat},0
</coordinates>
</Point>
</Placemark>`;

        });

        kml += `
</Folder>`;

    });

    kml += `
</Document>
</kml>`;

    return kml;

}
function distance(a,b){

    const dx =
        a.lat - b.lat;

    const dy =
        a.lon - b.lon;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}
    function optimizePoints(points){

    if(points.length < 3){
        return points;
    }

    const result = [];

    let current =
        points[0];

    result.push(current);

    const remaining =
        [...points.slice(1)];

    while(remaining.length){

        let bestIndex = 0;

        let bestDistance =
            distance(
                current,
                remaining[0]
            );

        for(
            let i = 1;
            i < remaining.length;
            i++
        ){

            const d =
                distance(
                    current,
                    remaining[i]
                );

            if(d < bestDistance){

                bestDistance = d;

                bestIndex = i;

            }

        }

        current =
            remaining.splice(
                bestIndex,
                1
            )[0];

        result.push(current);

    }

    return result;

}
    function openGoogleMaps(){

    const coordLines =
        document
        .getElementById("coords")
        .value
        .trim()
        .split(/\r?\n/);

    if(coordLines.length < 2){

        alert(
            "Ai nevoie de minim 2 puncte."
        );

        return;
    }

    let points = [];

    coordLines.forEach(line => {

        const parts =
            line.trim()
            .split(/\s+/);

        if(parts.length < 2){
            return;
        }

        points.push({

            lat:
                parseFloat(
                    parts[0]
                ),

            lon:
                parseFloat(
                    parts[1]
                )

        });

    });

    if(
        document.getElementById(
            "optimizeRoute"
        ).checked
    ){

        points =
            optimizePoints(
                points
            );

    }

    let url =
        "https://www.google.com/maps/dir/";

    points.forEach(point => {

        url +=
            point.lat +
            "," +
            point.lon +
            "/";

    });

    window.open(
        url,
        "_blank"
    );

}
function exportKML(){

    const blob =
        new Blob(
            [buildKML()],
            {
                type:
                "application/vnd.google-earth.kml+xml"
            }
        );

    const a =
        document.createElement("a");

    a.href =
        URL.createObjectURL(blob);

    a.download =
        "mentenanta.kml";

    a.click();

}

</script>

</body>
</html>
